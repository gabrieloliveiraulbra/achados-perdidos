services:
  db:
    # imagem oficial e especifica exigida pelo professor
    image: postgres:16-alpine
    # politica de reinicio obrigatoria
    restart: unless-stopped
    # puxa as credenciais do arquivo .env sem expor no codigo (RNF03)
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # volume nomeado para nao perder os dados do banco
      - dados_banco:/var/lib/postgresql/data
      # bind mount do arquivo sql como somente leitura (ro)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rede_interna
    # healthcheck usando pg_isready exigido para a aplicacao esperar o banco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # IMPORTANTE: nenhuma porta exposta no host para o db (exigencia da arquitetura)

  web:
    # controi a imagem usando o Dockerfile da pasta ./app
    build: ./app
    restart: unless-stopped
    # porta 5000 do container exposta como 8080 no host local
    ports:
      - "8080:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - UPLOAD_DIR=${UPLOAD_DIR}
    volumes:
      # volume nomeado para as fotos (montado no diretorio de uploads)
      - fotos:/app/uploads
    networks:
      - rede_interna
    # sobe a web APENAS quando o banco estiver "healthy" (RNF05)
    depends_on:
      db:
        condition: service_healthy

# declaracao dos volumes nomeados
volumes:
  dados_banco:
  fotos:

# declaracao da rede bridge interna (compartilhada pelos dois)
networks:
  rede_interna:
    driver: bridge